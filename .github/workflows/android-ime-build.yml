name: Build Android IME APK
on:
  push:
    branches: [feature/turkish-ime-bridge-v6]
    paths:
      - 'experimental/android-ime/**'
      - '.github/workflows/android-ime-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experimental/android-ime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build unsigned-source debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-Turkce-IME-Debug-APK
          path: experimental/android-ime/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
