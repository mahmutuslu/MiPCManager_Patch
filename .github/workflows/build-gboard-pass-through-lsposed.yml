name: Build Gboard Turkish Q v0.4 LSPosed APK
on:
  push:
    branches: [feature/gboard-turkish-q-v0-4]
  pull_request:
    branches: [main]
    paths:
      - 'experimental/gboard-pass-through-lsposed/**'
      - '.github/workflows/build-gboard-pass-through-lsposed.yml'
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK using preinstalled sdkmanager
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if test ! -x "$SDKMANAGER"; then
            SDKMANAGER="${ANDROID_HOME}/cmdline-tools/16.0/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build experimental module
        working-directory: experimental/gboard-pass-through-lsposed
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Gboard-Turkish-Q-v0.4-LSPosed-APK
          path: experimental/gboard-pass-through-lsposed/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
