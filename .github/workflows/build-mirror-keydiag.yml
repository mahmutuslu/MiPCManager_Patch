name: Build MirrorKeyDiag APK

on:
  push:
    branches: [feature/mirror-keydiag]
    paths:
      - 'experimental/mirror-keydiag/**'
      - '.github/workflows/build-mirror-keydiag.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experimental/mirror-keydiag/**'
      - '.github/workflows/build-mirror-keydiag.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android tools
        uses: android-actions/setup-android@v3

      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile and capture errors
        shell: bash
        working-directory: experimental/mirror-keydiag
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee "${GITHUB_WORKSPACE}/mirror-build.log"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MirrorKeyDiag-debug-APK
          path: experimental/mirror-keydiag/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish diagnostic error to repository issue
        if: ${{ failure() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## MirrorKeyDiag GitHub Actions failure"
            echo
            echo "- Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo
            echo "### Gradle output (last 120 lines, if available)"
            echo '~~~text'
            if test -f mirror-build.log; then
              tail -n 120 mirror-build.log | sed -E 's/(token|password|secret|key)=([^[:space:]]+)/\1=[REDACTED]/Ig'
            else
              echo "Build step was never reached. Failure occurred during checkout, Java, Android SDK, or Gradle setup."
            fi
            echo '~~~'
          } > /tmp/mirror-diag-issue.md
          gh issue create --repo "${GITHUB_REPOSITORY}" \
            --title "MirrorKeyDiag build failure (run ${GITHUB_RUN_ID})" \
            --body-file /tmp/mirror-diag-issue.md
