name: Build MirrorKeyDiag APK

on:
  push:
    branches: [feature/mirror-keydiag]
    paths:
      - 'experimental/mirror-keydiag/**'
      - '.github/workflows/build-mirror-keydiag.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experimental/mirror-keydiag/**'
      - '.github/workflows/build-mirror-keydiag.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if test ! -x "$SDKMANAGER"; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi
          echo "Using $SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'

      - name: Prepare Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compile APK
        working-directory: experimental/mirror-keydiag
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --stacktrace assembleDebug 2>&1 | tee "${GITHUB_WORKSPACE}/mirror-build.log"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MirrorKeyDiag-debug-APK
          path: experimental/mirror-keydiag/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload build diagnostic logs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: MirrorKeyDiag-build-logs
          path: mirror-build.log
          if-no-files-found: ignore
