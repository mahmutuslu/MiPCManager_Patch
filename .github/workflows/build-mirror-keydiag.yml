name: Build MirrorKeyDiag APK
on:
  push:
    branches: [feature/mirror-keydiag]
    paths:
      - 'experimental/mirror-keydiag/**'
      - '.github/workflows/build-mirror-keydiag.yml'
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: experimental/mirror-keydiag
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MirrorKeyDiag-debug-APK
          path: experimental/mirror-keydiag/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
